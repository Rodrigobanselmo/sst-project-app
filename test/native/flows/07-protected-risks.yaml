appId: com.simplesst.app
name: Duas edições de risco pós-envio pedem revisão
---
- startRecording: 07-protected-risks
- runFlow:
    when:
      visible: Sincronização concluída
    commands:
      - tapOn: OK
- swipe:
    start: "15%,75%"
    end: "15%,30%"
    duration: 650
- scrollUntilVisible:
    element: .*${PROTECTED_CHAR_1}.*
    direction: DOWN
    centerElement: true
    speed: 40
- tapOn: .*${PROTECTED_CHAR_1}.*
- extendedWaitUntil:
    visible: Nome do ambiente ou atividade
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- assertVisible: Riscos
- tapOn: Riscos
- tapOn: .*${RISK_1}.*
- extendedWaitUntil:
    visible: Probabiidade
    timeout: 15000
- tapOn:
    text: ${TARGET_PROBABILITY}
    index: 0
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Salvar
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Salvar
- extendedWaitUntil:
    notVisible: Probabiidade
    timeout: 15000
- assertVisible: Riscos
- tapOn: Salvar
- extendedWaitUntil:
    visible: Ambientes / Atividades
    timeout: 15000
- scrollUntilVisible:
    element: .*${PROTECTED_CHAR_2}.*
    direction: DOWN
    centerElement: true
    speed: 40
- tapOn: .*${PROTECTED_CHAR_2}.*
- extendedWaitUntil:
    visible: Nome do ambiente ou atividade
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- assertVisible: Riscos
- tapOn: Riscos
- tapOn: .*${RISK_2}.*
- extendedWaitUntil:
    visible: Probabiidade
    timeout: 15000
- tapOn:
    text: ${TARGET_PROBABILITY}
    index: 0
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Salvar
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Salvar
- extendedWaitUntil:
    notVisible: Probabiidade
    timeout: 15000
- assertVisible: Riscos
- tapOn: Salvar
- extendedWaitUntil:
    visible: Ambientes / Atividades
    timeout: 15000
- scrollUntilVisible:
    element: Sincronizar / tentar pendentes
    direction: UP
- tapOn: Sincronizar / tentar pendentes
- extendedWaitUntil:
    visible: Coleta preservada
    timeout: 90000
- tapOn: OK
- extendedWaitUntil:
    visible: .*Revisar 2 alteração\(ões\) em conjunto.*
    timeout: 90000
- takeScreenshot: 07-duas-decisoes-pendentes
- stopRecording
